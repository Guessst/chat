services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${ENV_POSTGRES_DB}
      POSTGRES_USER: ${ENV_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ENV_POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${ENV_RABBIT_MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${ENV_RABBIT_MQ_PASS}
    restart: always
    ports:
      - "5672:5672"   # app connections
      - "15672:15672" # mgmt UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_started # todo healthcheck
      rabbitmq:
        condition: service_healthy
    environment:
      ENV_RABBIT_MQ_HOSTNAME: ${ENV_RABBIT_MQ_HOSTNAME}
      ENV_RABBIT_MQ_USER: ${ENV_RABBIT_MQ_USER}
      ENV_RABBIT_MQ_PASS: ${ENV_RABBIT_MQ_PASS}
      ENV_POSTGRES_HOST: ${ENV_POSTGRES_HOST}
      ENV_POSTGRES_DB: ${ENV_POSTGRES_DB}
      ENV_POSTGRES_USER: ${ENV_POSTGRES_USER}
      ENV_POSTGRES_PASSWORD: ${ENV_POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ENV_ASPNETCORE_ENVIRONMENT}
    ports:
      - "8080:8080"
  
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  rabbitmq_data:
