name: Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- Backend ---
      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-backend:latest ./backend

      - name: Push backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-backend:latest

      # --- Frontend ---
      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-frontend:latest ./frontend

      - name: Push frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-frontend:latest

      # --- Deploy on VPS ---
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/chat
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
