name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # shallow clone

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- Backend ---
      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-backend:latest ./backend

      - name: Push backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-backend:latest

      # --- Frontend ---
      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/chat-frontend:latest ./frontend

      - name: Push frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/chat-frontend:latest

      # --- Deploy on VPS ---
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USER }}/chat
            cd /home/${{ secrets.VPS_USER }}/chat

            export REPOSITORY_SECRET=${{ secrets.REPOSITORY_SECRET }}
            if [ ! -d ".git" ]; then
              git clone --no-checkout --depth 1 https://$REPOSITORY_SECRET@github.com/Guessst/chat.git .
              git sparse-checkout init --no-cone
              git sparse-checkout set /docker-compose.yml /docker-compose.production.yml /frontend/nginx.production.conf
              git checkout main
            else
              git pull origin main
            fi

            # Deploy prebuilt images
            docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env.production pull
            docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env.production up -d
